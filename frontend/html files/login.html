{% extends "base.html" %}

{% block title %}Login | AlignWell{% endblock %}

{% block head %}
<style>
    /* LOGIN CARD */
    .login-container {
        max-width: 420px;
        margin: 60px auto;
        background: var(--card-bg);
        padding: 40px;
        border-radius: 24px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
    }

    .login-header {
        text-align: center;
        margin-bottom: 32px;
    }

    .login-header h2 {
        font-size: 2rem;
        margin-bottom: 8px;
        color: var(--text-main);
    }

    .login-header p {
        color: var(--text-muted);
        font-size: 1rem;
    }

    .form-group {
        margin-bottom: 24px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        font-size: 0.95rem;
        color: var(--text-main);
    }

    input {
        width: 100%;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid var(--border);
        font-size: 1rem;
        background: var(--bg-gradient);
        color: var(--text-main);
        outline: none;
        transition: border-color 0.2s;
    }

    input:focus {
        border-color: var(--accent);
    }

    .password-row {
        display: flex;
        gap: 12px;
        align-items: center;
    }

    .toggle-btn {
        padding: 10px 16px;
        background-color: var(--accent);
        color: white;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 600;
    }

    .login-btn {
        width: 100%;
        margin-top: 12px;
        padding: 16px;
        background: var(--accent);
        color: white;
        font-size: 1.1rem;
        font-weight: 700;
        border: none;
        border-radius: 16px;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        transition: all 0.3s ease;
    }

    .login-btn:hover {
        transform: translateY(-2px);
        background: var(--accent-hover);
        box-shadow: 0 12px 25px rgba(102, 126, 234, 0.4);
    }

    .register-redirect {
        text-align: center;
        margin-top: 24px;
        font-size: 1rem;
        color: var(--text-muted);
    }

    .register-redirect a {
        color: var(--accent);
        font-weight: 700;
        text-decoration: none;
    }

    .error-box {
        background: rgba(229, 62, 62, 0.1);
        color: var(--danger);
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 20px;
        text-align: center;
        font-size: 0.95rem;
        border: 1px solid var(--danger);
    }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-header">
        <h2>Welcome Back</h2>
        <p>Login to your account</p>
    </div>

    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="password-row">
                <input type="password" id="password" name="password" placeholder="••••••••" required>
                <button type="button" class="toggle-btn" onclick="togglePasswordVisibility('password')">Show</button>
            </div>
        </div>

        <button class="login-btn" type="submit">Login</button>
    </form>

    <div class="register-redirect">
        New to AlignWell? <a href="/register">Create an account</a>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function togglePasswordVisibility(fieldId) {
        const field = document.getElementById(fieldId);
        const button = event.target;

        if (field.type === 'password') {
            field.type = 'text';
            button.textContent = 'Hide';
        } else {
            field.type = 'password';
            button.textContent = 'Show';
        }
    }
</script>
{% endblock %}
