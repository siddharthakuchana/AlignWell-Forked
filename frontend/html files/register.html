<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register | AlignWell</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fb 0%, #eef1f7 100%);
            color: #2d3748;
        }

        /* NAVBAR */
        .navbar {
            background: #222;
            color: white;
            padding: 18px 28px;
            display: flex;
            justify-content: center;
        }

        .nav-center {
            text-align: center;
        }

        .nav-center h2 {
            margin: 0;
            font-size: 1.6rem;
            font-weight: 800;
        }

        .nav-center p {
            margin: 4px 0 0;
            font-size: 0.9rem;
            color: #cbd5e0;
        }

        /* REGISTER CARD */
        .register-container {
            max-width: 420px;
            margin: 60px auto;
            background: white;
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        }

        .register-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .register-header h1 {
            font-size: 1.8rem;
            margin-bottom: 6px;
        }

        .register-header p {
            color: #718096;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #cbd5e0;
            font-size: 0.95rem;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .submit-btn {
            width: 100%;
            margin-top: 10px;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
            transition: transform 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .login-redirect {
            text-align: center;
            margin-top: 18px;
            font-size: 0.9rem;
        }

        .login-redirect a {
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-center">
            <h2>AlignWell</h2>
            <p>Your smart posture correction partner</p>
        </div>
    </nav>

    <!-- REGISTER CARD -->
    <div class="register-container">

        <div class="register-header">
            <h1>Create Account</h1>
            <p>Fill the details to register</p>
        </div>

        {% if error %}
        <div style="color:red; margin-bottom:12px; text-align:center;">
            {{ error }}
        </div>
        {% endif %}

        <form action="/register" method="POST">

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>

            <button class="submit-btn" type="submit">Register</button>

        </form>

        <div class="login-redirect">
            Already have an account?
            <a href="/login">Login</a>
        </div>

    </div>

</body>

</html>
