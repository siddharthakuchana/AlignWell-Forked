{% extends "base.html" %}

{% block title %}Register | AlignWell{% endblock %}

{% block head %}
<style>
    /* REGISTER CARD */
    .register-container {
        max-width: 420px;
        margin: 60px auto;
        background: var(--card-bg);
        padding: 40px;
        border-radius: 24px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
    }

    .register-header {
        text-align: center;
        margin-bottom: 32px;
    }

    .register-header h1 {
        font-size: 2rem;
        margin-bottom: 8px;
        color: var(--text-main);
    }

    .register-header p {
        color: var(--text-muted);
        font-size: 1rem;
    }

    .form-group {
        margin-bottom: 24px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        font-size: 0.95rem;
        color: var(--text-main);
    }

    input {
        width: 100%;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid var(--border);
        font-size: 1rem;
        background: var(--bg-gradient);
        color: var(--text-main);
        outline: none;
    }

    input:focus {
        border-color: var(--accent);
    }

    .submit-btn {
        width: 100%;
        margin-top: 12px;
        padding: 16px;
        background: var(--accent);
        color: white;
        font-size: 1.1rem;
        font-weight: 700;
        border: none;
        border-radius: 16px;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        transition: all 0.3s ease;
    }

    .submit-btn:hover {
        transform: translateY(-2px);
        background: var(--accent-hover);
        box-shadow: 0 12px 25px rgba(102, 126, 234, 0.4);
    }

    .login-redirect {
        text-align: center;
        margin-top: 24px;
        font-size: 1rem;
        color: var(--text-muted);
    }

    .login-redirect a {
        color: var(--accent);
        font-weight: 700;
        text-decoration: none;
    }

    .error-box {
        background: rgba(229, 62, 62, 0.1);
        color: var(--danger);
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 20px;
        text-align: center;
        font-size: 0.95rem;
        border: 1px solid var(--danger);
    }
</style>
{% endblock %}

{% block content %}
<div class="register-container">
    <div class="register-header">
        <h1>Create Account</h1>
        <p>Join AlignWell today</p>
    </div>

    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}

    <form action="/register" method="POST">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="fitness_hero" required>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>

        <button class="submit-btn" type="submit">Create Account</button>
    </form>

    <div class="login-redirect">
        Already have an account? <a href="/login">Sign in</a>
    </div>
</div>
{% endblock %}
