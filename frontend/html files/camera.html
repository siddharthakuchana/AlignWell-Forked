<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlignWell Tracker</title>

    <style>
        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            background: #222;
            color: white;
        }

        .main {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 30px;
        }

        .video-box {
            position: relative;
            width: 640px;
            height: 480px;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 640px;
            height: 480px;
            border: 2px solid #333;
            border-radius: 10px;
            z-index: 1;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 640px;
            height: 480px;
            z-index: 10;
            /* ✅ above video */
            pointer-events: none;
        }

        .feedback-box {
            width: 280px;
            border: 1px solid #ccc;
            border-radius: 12px;
            padding: 15px;
        }

        .status {
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
        }

        button {
            margin: 3px;
            padding: 6px 10px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- 🔐 AUTH CHECK -->
    <script>
        if (localStorage.getItem("isLoggedIn") !== "true") {
            alert("You are not logged in.");
            localStorage.setItem("returnUrl", window.location.href);
            window.location.href = "login.html";
        }
    </script>

    <!-- NAVBAR -->
    <nav class="navbar">
        <span>AlignWell | <a href="pushups.html" style="color:white;">⬅ Back</a></span>
        <span><b id="user"></b> <button onclick="logout()">Logout</button></span>
    </nav>

    <h2 style="text-align:center;">Posture Tracker</h2>

    <div class="main">

        <!-- VIDEO + CANVAS -->
        <div class="video-box">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas" width="640" height="480"></canvas>
        </div>

        <!-- FEEDBACK PANEL -->
        <div class="feedback-box">

            <h3>Exercise Control</h3>

            <div style="margin-bottom: 15px;">
                <button onclick="selectExercise('pushup')">Pushups</button>
                <button onclick="selectExercise('squat')">Squats</button>
                <button onclick="selectExercise('benchpress')">Bench Press</button>
                <button onclick="selectExercise('shoulderraise')">Shoulder Raise</button>
                <button onclick="selectExercise('crunches')">Crunches</button>
                <button onclick="selectExercise('deadlift')">Deadlift</button>
                <button onclick="selectExercise('bicepcurl')">Bicep Curl</button>
            </div>

            <div id="output" style="color:#666;font-style:italic;margin-bottom:10px;">
                Select exercise...
            </div>

            <hr>

            <div style="background:#f9f9f9;padding:10px;border-radius:8px;margin-top:10px;">
                <p id="repText" style="font-size:24px;font-weight:bold;margin:5px 0;">Reps: 0</p>
                <p id="accuracyText" style="font-size:18px;color:#007bff;margin:5px 0;">Accuracy: 0%</p>
                <p id="formText" style="color:#555;margin:5px 0;">Form: --</p>
                <div id="statusText" class="status">Waiting...</div>

                <button onclick="resetStats()" style="margin-top:10px;background:#6c757d;color:white;">
                    Reset Stats
                </button>
            </div>

            <div id="angleDisplay"
                style="margin-top:15px;font-family:monospace;font-size:14px;color:#444;display:none;">
                <p>--- Real-time Angles ---</p>
                <div id="angleContent"></div>
            </div>

            <br>

            <button onclick="startCamera()" style="background:#28a745;color:white;">
                Start Camera
            </button>

            <button onclick="stopCamera()" style="background:#dc3545;color:white;">
                Stop
            </button>

        </div>
    </div>

    <!-- ✅ IMPORTANT: websocket FIRST, camera SECOND -->
    <script src="../scripts/websocket.js"></script>
    <script src="../scripts/camera.js"></script>

    <script>
        document.getElementById("user").innerText = localStorage.getItem("username");

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }
    </script>

</body>

</html>
